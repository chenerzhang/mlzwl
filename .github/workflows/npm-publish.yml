name: npm trusted publishing

on:
  push:
    branches:
      - master
    paths:
      - '.release/npm/*.json'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and prepare npm release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.6.1 --ignore-scripts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release registry
        run: node scripts/npm-release.mjs validate-config
      - name: Verify and prepare immutable release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs prepare
      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/npm-release-artifact
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish marked npm packages
    needs: prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: write
      id-token: write
    timeout-minutes: 10
    env:
      NODE_VERSION: 22.20.0
      NODE_LINUX_X64_SHA256: 00bbd05e306ea68b6e13e17360d0e2f680b493ef95f2fea1c4296ff7437530bc
      NPM_VERSION: 11.6.1
      NPM_INTEGRITY: sha512-7iDSHDoup6uMQJ37yWrhfqcbMhF0UEfGRap6Nv+aKQcrIJXlCi2cKbj75WBmiHlcwsQCy/U0zEwDZdAx6H/Vaw==
      ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
      RELEASE_SCRIPT_SHA256: 1d92c75e1479018b494030e6c9a8e5a31780a57cdbba1cb5ff5e3bc1535bdd98
      RELEASE_REGISTRY_SHA256: efcfbab1e0a0d42f258943cddd0ca93cd31fe236340913a0f465419db2a75db2
    steps:
      - name: Publish packages and complete GitHub delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OIDC_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?}"
          OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:?}"
          GITHUB_API_TOKEN="${GITHUB_TOKEN:?}"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          mkdir -p /tmp/node-runtime /tmp/npm-runtime .tmp/npm-release-artifact .tmp/npm-release-trusted

          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            --output /tmp/node.tar.xz
          echo "${NODE_LINUX_X64_SHA256}  /tmp/node.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/node.tar.xz --strip-components=1 -C /tmp/node-runtime

          export ARTIFACT_NAME="npm-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARTIFACT_URL=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | /tmp/node-runtime/bin/node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => { const name=process.env.ARTIFACT_NAME; const matches=JSON.parse(data).artifacts.filter(item => item.name === name && !item.expired); if (matches.length !== 1) throw new Error('expected one immutable release artifact'); process.stdout.write(matches[0].archive_download_url); })")
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$ARTIFACT_URL" \
            --output /tmp/npm-release-artifact.zip
          echo "${ARTIFACT_DIGEST#sha256:}  /tmp/npm-release-artifact.zip" | sha256sum --check --strict
          unzip -q /tmp/npm-release-artifact.zip -d .tmp/npm-release-artifact

          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" \
            --output /tmp/npm.tgz
          test "$(/tmp/node-runtime/bin/node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync('/tmp/npm.tgz')).digest('base64'))")" = "$NPM_INTEGRITY"
          tar -xzf /tmp/npm.tgz -C /tmp/npm-runtime

          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/npm-release.mjs?ref=${GITHUB_SHA}" \
            --output .tmp/npm-release-trusted/npm-release.mjs
          echo "${RELEASE_SCRIPT_SHA256}  .tmp/npm-release-trusted/npm-release.mjs" | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.release/npm-packages.json?ref=${GITHUB_SHA}" \
            --output .tmp/npm-release-trusted/npm-packages.json
          echo "${RELEASE_REGISTRY_SHA256}  .tmp/npm-release-trusted/npm-packages.json" | sha256sum --check --strict

          cat > /tmp/node-runtime/bin/npm <<'EOF'
          #!/bin/sh
          exec /tmp/node-runtime/bin/node /tmp/npm-runtime/package/bin/npm-cli.js "$@"
          EOF
          chmod +x /tmp/node-runtime/bin/npm
          export PATH="/tmp/node-runtime/bin:$PATH"
          export NPM_CLI_JS="/tmp/npm-runtime/package/bin/npm-cli.js"
          export NPM_RELEASE_REGISTRY="$PWD/.tmp/npm-release-trusted/npm-packages.json"
          test "$(npm --version)" = "$NPM_VERSION"
          ACTIONS_ID_TOKEN_REQUEST_TOKEN="$OIDC_REQUEST_TOKEN" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$OIDC_REQUEST_URL" \
            GITHUB_TOKEN="$GITHUB_API_TOKEN" \
            node .tmp/npm-release-trusted/npm-release.mjs publish
