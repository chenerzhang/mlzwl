<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      浏览器用这个值给移动端地址栏 / 状态栏着色。用两条带 `media` 的 meta 覆盖
      首屏：主题确定前（JS 未执行）浏览器自己按系统配色挑一条，不会先涂错色。

      主题确定后由 `applyTheme()` 把**所有** `theme-color` 的 `content` 改成同一个
      解析值。用户手动选的主题优先级高于系统，所以那时 `media` 不再参与判断。

      取值必须与 `styles/index.css` 的 `--color-surface` 逐字节一致（深色
      `#08080a` / 浅色 `#f5f5f7`），否则屏幕边缘会露出一条错色带。

      App 内的 WebView 不读这个 meta：系统栏由 `MainActivity.applyStatusBarAppearance()`
      按页面主题涂。
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08080a" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="description" content="红果短剧网页版：推荐流、搜索、选集、播放与观看历史。" />
    <title>红果短剧</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
